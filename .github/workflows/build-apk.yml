name: Build Ashen Arena 3D APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Configure Godot Android export
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Install current Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Validate project
        run: godot --headless --path godot --editor --quit
      - name: Build debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/build/android/AshenArena.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AshenArena-3D-APK
          path: build/android/AshenArena.apk
          if-no-files-found: error
